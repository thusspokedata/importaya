  <link rel="stylesheet" href="styles.css">
  <style>
    .hero-preview { min-height: 100vh; padding: 42px 20px 56px; background: #071c31; }
    .hero-preview-header { max-width: 1500px; margin: 0 auto 28px; color: #fff; text-align: center; }
    .hero-preview-header h1 { font-size: clamp(26px, 4vw, 40px); }
    .hero-preview-header p { margin-top: 10px; color: #9fbdd8; }
    .hero-preview-grid { max-width: 1500px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; align-items: stretch; }
    .hero-preview-card { overflow: hidden; border: 1px solid rgba(255,255,255,.16); border-radius: 24px; background: var(--navy); }
    .hero-preview-card .hero { height: 100%; }
    .hero-preview-card .hero .container { display: block; padding: 24px 12px 18px; }
    .hero-preview-card h2 { margin: 0 8px 14px; color: #fff; font-size: 18px; line-height: 1.35; }
    .hero-preview-card h2 span { display: block; margin-bottom: 5px; color: #57b6f2; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
    .hero-preview-card .hero-art { max-width: 460px; }
    @media (max-width: 940px) {
      .hero-preview-grid { grid-template-columns: 1fr; max-width: 540px; }
    }
    @media (max-width: 560px) {
      .hero-preview { padding: 28px 12px 36px; }
      .hero-preview-card .hero .container { padding: 20px 0 12px; }
    }
  </style>
