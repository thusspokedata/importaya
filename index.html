  <style>
    :root {
      --bg: #eaf3fb;
      --bg-edge: #d7e8f7;
      --wa: #25d366;
      --wa-dark: #1da851;
      --ink: #0b2a4a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-edge) 100%);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
      min-height: 100vh;
    }
    .page {
      max-width: 820px;
      margin: 0 auto;
      padding: 16px 12px 96px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .board {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(11, 42, 74, 0.14);
      background: #fff;
    }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
    }

    /* Botón flotante de WhatsApp */
    .wa-fab {
      position: fixed;
      right: max(16px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom));
      z-index: 50;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px 12px 14px;
      background: var(--wa);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      border-radius: 999px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      transition: transform .12s ease, background .12s ease;
    }
    .wa-fab:hover { background: var(--wa-dark); transform: translateY(-2px); }
    .wa-fab:active { transform: translateY(0); }
    .wa-fab svg { width: 26px; height: 26px; flex: 0 0 auto; }
    .wa-fab .wa-label { white-space: nowrap; }

    /* En pantallas chicas dejamos solo el ícono para no tapar contenido */
    @media (max-width: 480px) {
      .wa-fab { padding: 14px; }
      .wa-fab .wa-label { display: none; }
      .wa-fab svg { width: 30px; height: 30px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1 class="visually-hidden">ImportaYa by Vertex — Comprá en China, nosotros lo acercamos a tu negocio en Argentina</h1>

    <img class="board" src="assets/hero.png" width="1592" height="1562"
         alt="ImportaYa by Vertex: de China hasta tu negocio. Comprá en China, nosotros lo acercamos a tu negocio en Argentina. Rápido, seguro y simple. Cotizá tu envío por WhatsApp 385 334 1111."
         loading="eager" fetchpriority="high" decoding="async">

    <img class="board" src="assets/proceso.png" width="1460" height="1534"
         alt="¿Cómo funciona? Es muy simple: 1) Buscá tu producto y proveedor en China, 2) Completá el formulario de cotización, 3) Recibí tu cotización, 4) Gestionamos el pago, 5) Recibí tu mercadería en Argentina."
         loading="lazy" decoding="async">
  </main>
