server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache largo para las imágenes (assets versionados por contenido rara vez cambian)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # La versión /pro quedó unificada en la raíz: redirigimos por si quedan enlaces viejos.
    location = /pro  { return 301 /; }
    location = /pro/ { return 301 /; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Compresión (las PNG ya vienen comprimidas; ayuda al HTML/CSS)
    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 512;
}
